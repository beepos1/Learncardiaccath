<!doctype html>
<html lang="en">
<head>
<title>Quiz — Learn Cardiac Cath</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 22 A11 11 0 1 1 26 22' fill='none' stroke='%233aa0ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='27' r='3.5' fill='%23f0a040'/%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/" } }</script>
<script src="js/site.js" defer></script>
</head>
<body>
<main>
  <section class="hero" style="padding-bottom:18px">
    <div class="wrap">
      <div class="kicker">Module 4</div>
      <h1>Name that view</h1>
      <p class="lead">Two drills. <b>Identify</b>: look at the angiogram and name the projection. <b>Dial it in</b>: you're given a view, set the C-arm yourself.</p>
    </div>
  </section>
  <section style="padding-top:0">
    <div class="wrap">
      <div class="quiz-top">
        <div class="seg quiz-modes" role="group" aria-label="Quiz mode">
          <button class="btn-mode on" data-q="identify" style="font:inherit;padding:8px 14px;color:inherit;cursor:pointer">Identify</button>
          <button class="btn-mode" data-q="dial" style="font:inherit;padding:8px 14px;color:inherit;cursor:pointer">Dial it in</button>
        </div>
        <div class="score" id="score">0 / 0</div>
      </div>
      <div id="q-identify">
        <div id="lab-id"></div>
        <div class="choices" id="choices"></div>
        <div class="feedback" id="fb-id"></div>
        <button class="btn" id="next-id">Next image →</button>
      </div>
      <div id="q-dial" hidden>
        <h2 id="dial-target"></h2>
        <p class="muted" id="dial-sub"></p>
        <div id="lab-dial"></div>
        <div class="btn-row"><button class="btn" id="check-dial">Check my angles</button><button class="btn ghost" id="next-dial">New target →</button></div>
        <div class="feedback" id="fb-dial"></div>
      </div>
    </div>
  </section>
</main>
<script type="module">
  import { createLab } from './js/lab.js';
  import { VIEWS, formatAngles } from './js/views-data.js';
  const $ = (id) => document.getElementById(id);
  let right = 0, total = 0;
  const score = () => ($('score').textContent = `${right} / ${total}`);
  const pick = (arr, n) => arr.slice().sort(() => Math.random() - 0.5).slice(0, n);

  // ---- identify ----
  const labId = createLab($('lab-id'), { room: false, controls: false, readout: false, labels: false, lao: 0, cran: 0 });
  let current;
  function nextId() {
    current = VIEWS[Math.floor(Math.random() * VIEWS.length)];
    // small jitter so the image isn't always pixel-identical
    const j = () => Math.round((Math.random() - 0.5) * 8);
    labId.setSystem(current.sys); labId.setLabels(false); labId.setReadout(false);
    labId.setAngles(current.lao + j(), current.cran + j(), false);
    const opts = pick(VIEWS.filter((v) => v !== current && v.sys === current.sys), 3).concat(current).sort(() => Math.random() - 0.5);
    $('choices').innerHTML = '';
    $('fb-id').textContent = '';
    for (const v of opts) {
      const b = document.createElement('button');
      b.textContent = v.name;
      b.addEventListener('click', () => answer(b, v));
      $('choices').appendChild(b);
    }
    setTimeout(() => labId.inject(), 300);
  }
  function answer(btn, v) {
    total++;
    const ok = v === current;
    if (ok) right++;
    [...$('choices').children].forEach((b) => { b.disabled = true; if (b.textContent === current.name) b.classList.add('right'); });
    if (!ok) btn.classList.add('wrong');
    $('fb-id').innerHTML = (ok ? '<b style="color:var(--good)">Correct.</b> ' : `<b style="color:var(--bad)">Not quite</b> — this is <b>${current.name}</b>. `) +
      `${formatAngles(current.lao, current.cran)}: ${current.tips[0]}`;
    labId.setLabels(true); labId.setReadout(true);
    score();
  }
  $('next-id').addEventListener('click', nextId);

  // ---- dial ----
  const labDial = createLab($('lab-dial'), { presets: false, readout: true, lao: 0, cran: 0, compact: true });
  let target;
  function nextDial() {
    target = VIEWS[Math.floor(Math.random() * VIEWS.length)];
    $('dial-target').textContent = `Set up: ${target.name}`;
    $('dial-sub').textContent = `${target.nickname} — ${target.sys === 'L' ? 'left' : 'right'} coronary. Get within ±10° on both axes.`;
    $('fb-dial').textContent = '';
    labDial.setSystem(target.sys); labDial.setAngles(0, 0, true);
  }
  $('check-dial').addEventListener('click', () => {
    const { lao, cran } = labDial.getAngles();
    const dl = lao - target.lao, dc = cran - target.cran;
    const ok = Math.abs(dl) <= 10 && Math.abs(dc) <= 10;
    total++; if (ok) right++; score();
    const hint = [];
    if (Math.abs(dl) > 10) hint.push(dl > 0 ? 'rotate further toward RAO' : 'rotate further toward LAO');
    if (Math.abs(dc) > 10) hint.push(dc > 0 ? 'more caudal' : 'more cranial');
    $('fb-dial').innerHTML = ok
      ? `<b style="color:var(--good)">Nice.</b> You set ${formatAngles(lao, cran)}; textbook is ${formatAngles(target.lao, target.cran)}.`
      : `<b style="color:var(--bad)">Not yet</b> — ${hint.join(' and ')}. (You: ${formatAngles(lao, cran)})`;
  });
  $('next-dial').addEventListener('click', nextDial);

  document.querySelectorAll('.btn-mode').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.btn-mode').forEach((x) => x.classList.toggle('on', x === b));
    $('q-identify').hidden = b.dataset.q !== 'identify';
    $('q-dial').hidden = b.dataset.q !== 'dial';
  }));
  nextId(); nextDial(); score();
</script>
</body>
</html>
